name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest
      - name: Verify HEAD is on the pushed tag
        run: git describe --exact-match --tags HEAD
      - name: Verify package.json version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run verify
      # Auth: Trusted Publishing via OIDC. Configure once at
      # https://www.npmjs.com/package/mconf/access -> Trusted Publishers.
      # No NPM_TOKEN secret is used.
      - run: npm publish --provenance --access public
